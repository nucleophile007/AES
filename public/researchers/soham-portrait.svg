<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <clipPath id="portrait-clip">
      <rect width="600" height="800" rx="8" />
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)" clip-path="url(#portrait-clip)"/>
  
  <!-- Silhouette placeholder circle (Head and Shoulders) -->
  <circle cx="300" cy="300" r="120" fill="#ffffff" opacity="0.05"/>
  <path d="M100 800 C100 550, 500 550, 500 800 Z" fill="#ffffff" opacity="0.05"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
  </pattern>
  <rect width="600" height="800" fill="url(#grid)" clip-path="url(#portrait-clip)"/>

  <!-- Large Initial -->
  <text x="300" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" opacity="0.1" text-anchor="middle" dominant-baseline="middle">S</text>
  
  <!-- Placeholder Text -->
  <text x="300" y="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" opacity="0.4" text-anchor="middle" letter-spacing="0.2em">SOHAM PORTRAIT</text>
  <text x="300" y="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" opacity="0.3" text-anchor="middle" letter-spacing="0.1em">(REPLACE WITH PHOTO)</text>
</svg>
